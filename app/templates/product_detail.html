<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }} | Mini Store</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<header class="navbar">

    <div class="logo">
        Mini Store
    </div>

    <nav>

        <a href="{{ url_for('main.home') }}">
            Home
        </a>

        <a href="{{ url_for('main.home') }}#products">
            Products
        </a>

        <a href="#">
            Cart 🛒
        </a>

    </nav>

</header>


<main class="product-details">

    <div class="detail-image">

        <img
            src="{{ url_for('static', filename='images/' + product.image) }}"
            alt="{{ product.name }}"
        >

    </div>


    <div class="detail-info">

        <p class="category">
            {{ product.category }}
        </p>

        <h1>
            {{ product.name }}
        </h1>

        <p class="rating">
            ★ {{ product.rating }}
        </p>

        <p class="detail-price">
            ${{ "%.2f"|format(product.price) }}
        </p>

        <p class="detail-description">
            {{ product.description }}
        </p>

        <button class="add-cart-button">
            Add to Cart
        </button>

    </div>

</main>

</body>

</html>
