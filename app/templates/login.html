<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MiniStore</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header class="navbar">

        <a href="{{ url_for('main.home') }}" class="logo">
            <span class="logo-main">Mini</span><span class="logo-accent">Store</span>
        </a>

        <nav>

            <a href="{{ url_for('main.home') }}">
                Home
            </a>

            <a href="{{ url_for('main.home') }}#products">
                Products
            </a>

            <a href="{{ url_for('main.cart') }}">
                Cart
            </a>

            <a href="{{ url_for('main.register') }}">
                Register
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <p class="section-label">
                    WELCOME BACK
                </p>

                <h1>
                    Sign in
                </h1>

                <p>
                    Access your MiniStore account.
                </p>

            </div>


            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" required>

                </div>


                <button type="submit" class="auth-submit">
                    Sign In
                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="{{ url_for('main.register') }}">
                    Create one
                </a>

            </div>

        </div>

    </main>


    <footer>

        <p>
            <strong>MiniStore</strong>
            &copy; 2026. All rights reserved.
        </p>

    </footer>

</body>

</html>
