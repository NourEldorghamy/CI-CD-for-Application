<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | MiniStore</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header class="navbar">

        <a href="{{ url_for('main.home') }}" class="logo">
            <span class="logo-main">Mini</span><span class="logo-accent">Store</span>
        </a>

        <nav>

            <a href="{{ url_for('main.home') }}">
                Home
            </a>

            <a href="{{ url_for('main.home') }}#products">
                Products
            </a>

            <a href="{{ url_for('main.cart') }}">
                Cart
            </a>

            <a href="{{ url_for('main.login') }}">
                Login
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <p class="section-label">
                    JOIN MINISTORE
                </p>

                <h1>
                    Create Account
                </h1>

                <p>
                    Start shopping with your personal account.
                </p>

            </div>


            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text" id="name" name="name" class="form-control" placeholder="Your full name" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="At least 8 characters" minlength="8" required>

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                        placeholder="Repeat your password" minlength="8" required>

                </div>


                <button type="submit" class="auth-submit">
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                Already have an account?

                <a href="{{ url_for('main.login') }}">
                    Sign in
                </a>

            </div>

        </div>

    </main>


    <footer>

        <p>
            <strong>MiniStore</strong>
            &copy; 2026. All rights reserved.
        </p>

    </footer>

</body>

</html>
